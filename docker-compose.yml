services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Sup3rS3cret!Pass"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -N -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=sqlserver;Database=InventorySystemDb;User Id=sa;Password=Sup3rS3cret!Pass;TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Dev-only signing key for a self-contained `docker compose up` demo -
      # never reuse this for anything real. See appsettings.Development.json
      # for the equivalent used outside Docker.
      Jwt__Key: "Docker-Compose-Demo-Only-Signing-Key-Do-Not-Reuse-1234567890AB"
      Jwt__Issuer: "InventorySystem"
      Jwt__Audience: "InventorySystem"
      Jwt__ExpiryMinutes: "60"

volumes:
  mssql_data:
