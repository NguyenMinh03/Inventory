server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any path that isn't a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin from the browser's perspective, so the app never needs CORS
    # in the docker-compose scenario - just plain relative /api/... fetches.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
